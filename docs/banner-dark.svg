<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Stella — 舞萌 DX 的 Web 控制台">
  <title>Stella — 舞萌 DX 的 Web 控制台</title>
  <defs>
    <radialGradient id="skyD" cx="28%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1d4d78"/>
      <stop offset="0.62" stop-color="#101820"/>
      <stop offset="1" stop-color="#101820"/>
    </radialGradient>
    <style id="banner-fonts">@font-face{font-family:'LXGW WenKai Banner';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Stella Title Banner';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}</style>
  </defs>

  <rect x="0" y="0" width="1280" height="400" rx="14" fill="url(#skyD)"/>

  <!-- 星尘 -->
  <g fill="#d6e4f0" opacity="0.28">
    <circle cx="90" cy="64" r="1.8"/><circle cx="179" cy="232" r="1.7"/><circle cx="307" cy="120" r="2.4"/>
    <circle cx="486" cy="296" r="1.7"/><circle cx="666" cy="72" r="2"/><circle cx="845" cy="184" r="1.7"/>
    <circle cx="998" cy="48" r="2.5"/><circle cx="1101" cy="264" r="1.7"/><circle cx="1190" cy="144" r="1.7"/>
    <circle cx="230" cy="336" r="2"/><circle cx="563" cy="40" r="1.7"/><circle cx="742" cy="352" r="1.8"/>
    <circle cx="922" cy="328" r="1.7"/><circle cx="384" cy="192" r="1.7"/>
  </g>

  <!-- 星轨 -->
  <path id="trailD" d="M463 208 C 640 93, 842 307, 1010 144" fill="none"
        stroke="#9ecaff" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="2 8"/>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="0s"/>
    <animateMotion dur="32s" repeatCount="indefinite" rotate="0" calcMode="spline"
      keyPoints="0;1;0" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1">
      <mpath href="#trailD"/>
    </animateMotion>
    <circle cx="0" cy="0" r="38" fill="#9ecaff" opacity="0.16"/>
    <circle cx="0" cy="0" r="21" fill="#9ecaff" opacity="0.3"/>
    <circle cx="0" cy="0" r="12" fill="#9ecaff"/>
  </g>
  <circle cx="1010" cy="144" r="16" fill="#8aa0b8" opacity="0.1"/>
  <circle cx="1010" cy="144" r="9" fill="#8aa0b8" opacity="0.18"/>
  <circle cx="1010" cy="144" r="5" fill="#8aa0b8"/>

  <!-- 文案 -->
  <g font-family="'LXGW WenKai Banner','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="150" font-size="20" letter-spacing="8" fill="#d6e4f0" fill-opacity="0.64">ステラ</text>
    <text x="58" y="246" font-size="96" font-weight="600" fill="#d6e4f0" font-family="'Stella Title Banner','Segoe UI',sans-serif">Stella</text>
    <text x="64" y="292" font-size="26" fill="#d6e4f0" fill-opacity="0.64">舞萌 DX 的 Web 控制台</text>

    <text x="1216" y="112" text-anchor="end" font-size="20" fill="#d6e4f0" fill-opacity="0.64">Astral</text>
    <text x="1216" y="140" text-anchor="end" font-size="15" letter-spacing="3" fill="#d6e4f0" fill-opacity="0.64">背后的协议库</text>

    <text x="64" y="352" font-size="23" font-weight="600" fill="#d6e4f0">夜空一直在等待着被点亮的那一天。<tspan dx="14" font-size="15" font-weight="400" fill="#d6e4f0" fill-opacity="0.64">— じん《ステラ》</tspan></text>
  </g>

  <rect x="1" y="1" width="1278" height="398" rx="13" fill="none" stroke="#9ecaff" stroke-opacity="0.35"/>
</svg>
